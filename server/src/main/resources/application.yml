spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  config:
    import: optional:file:../.env[.properties],optional:file:./.env[.properties]

  application:
    name: stay-smart-server

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: ${DB_DRIVER_CLASS_NAME}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/changelog-master.yml

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 50MB

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      repositories:
        enabled: false

  cache:
    type: redis
    redis:
      time-to-live: 10m
      cache-null-values: false

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE}
          ssl:
            enable: ${MAIL_SMTP_SSL_ENABLE:false}
          connectiontimeout: ${MAIL_CONNECTION_TIMEOUT:5000}
          timeout: ${MAIL_TIMEOUT:5000}
          writetimeout: ${MAIL_WRITE_TIMEOUT:5000}

server:
  port: ${SERVER_PORT}

jwt:
  secret:
    access: ${JWT_ACCESS_SECRET}
    refresh: ${JWT_REFRESH_SECRET}
  expiration:
    access-minutes: ${JWT_ACCESS_MINUTES}
    refresh-days: ${JWT_REFRESH_DAYS}

app:
  frontend-url: ${FRONTEND_URL}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  admin:
    email: ${ADMIN_EMAIL}
    username: ${ADMIN_USERNAME}
    password: ${ADMIN_PASSWORD}
  turnstile:
    secret-key: ${TURNSTILE_SECRET_KEY}
    verify-url: ${TURNSTILE_VERIFY_URL}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME}
    api-key: ${CLOUDINARY_API_KEY}
    api-secret: ${CLOUDINARY_API_SECRET}
    upload-folder: ${CLOUDINARY_UPLOAD_FOLDER}
  email:
    from: ${MAIL_FROM}

springdoc:
  api-docs:
    path: ${SPRINGDOC_API_DOCS_PATH}
    version: ${SPRINGDOC_API_DOCS_VERSION}
  swagger-ui:
    path: ${SPRINGDOC_SWAGGER_UI_PATH}
